<!DOCTYPE html>
<!-- WordPress移植時: このファイルを削除し、Contact Form 7等を使ったWordPressの固定ページ（スラッグ: sample-request）に置き換えてください -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UV FORTE シールドセラムの無料サンプル（約2ml）をお届けします。お一人様1回限り・送料無料。数量限定のため在庫がなくなり次第終了します。">
  <title>サンプル請求 | UV FORTE シールドセラム</title>
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="canonical" href="https://lumiere-cosme.jp/sample-request/">
  <meta property="og:title" content="サンプル請求 | UV FORTE シールドセラム">
  <meta property="og:description" content="UV FORTE シールドセラムの無料サンプルをお届けします。数量限定。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lumiere-cosme.jp/sample-request/">
  <meta property="og:image" content="https://lumiere-cosme.jp/images/ogp.png">
  <meta property="og:site_name" content="LUMIÉRE">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <!-- GA4測定IDはダミー値です。実案件公開時に実測定IDへ差し替えてください -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <!-- Webフォント: 自己ホスト化（2026-07-17） -->
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="font-sans bg-white text-navy">

<header class="sp-header">
  <a href="../index.html" class="sp-header-logo">LUMIÉRE</a>
  <a href="../order/index.html?plan=teiki" class="btn-gold-sm">今すぐ購入</a>
</header>

<main class="sp-body">
  <div class="sp-inner">
    <h1>サンプル請求</h1>

    <div class="sp-notice">
      UV FORTE シールドセラムの1回分サンプル（約2ml）を無料でお届けします。お一人様1回限り。発送先は日本国内のみ。送料は当社負担です。数量限定のため、在庫がなくなり次第終了します。
    </div>

    <!-- WordPress移植時: このformタグをContact Form 7のショートコードに置き換えてください -->
    <form id="sample-request-form" class="sp-form-grid" action="#" method="post">
      <input type="hidden" name="form_type" value="sample_request">
      <div class="hp-field" aria-hidden="true">
        <label for="sr-hp">この項目は入力しないでください</label>
        <input type="text" id="sr-hp" name="hp_confirm" tabindex="-1" autocomplete="off">
      </div>

      <div>
        <label class="sp-form-label" for="sr-name">
          お名前 <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="text" id="sr-name" name="name"
          placeholder="山田 花子" autocomplete="name" required>
      </div>

      <div>
        <label class="sp-form-label" for="sr-email">
          メールアドレス <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="email" id="sr-email" name="email"
          placeholder="example@email.com" autocomplete="email" required>
      </div>

      <div>
        <label class="sp-form-label" for="sr-zip">
          郵便番号 <span class="req">必須</span>
        </label>
        <input class="sp-form-input sp-form-input--sm" type="text" id="sr-zip" name="zip"
          placeholder="000-0000" autocomplete="postal-code" maxlength="8" required>
      </div>

      <div>
        <label class="sp-form-label" for="sr-address">
          住所 <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="text" id="sr-address" name="address"
          placeholder="東京都渋谷区〇〇町1-2-3" autocomplete="address-line1" required>
      </div>

      <div>
        <label class="sp-form-label" for="sr-building">
          建物名・部屋番号 <span class="sp-optional-label">任意</span>
        </label>
        <input class="sp-form-input" type="text" id="sr-building" name="building"
          placeholder="LUMIÉREマンション 101号室" autocomplete="address-line2">
      </div>

      <div>
        <label class="sp-form-label" for="sr-skin">
          肌質（参考情報） <span class="sp-optional-label">任意</span>
        </label>
        <select class="sp-form-select" id="sr-skin" name="skin_type">
          <option value="" disabled selected>選択してください</option>
          <option value="sensitive">敏感肌</option>
          <option value="dry">乾燥肌</option>
          <option value="oily">脂性肌</option>
          <option value="combination">混合肌</option>
          <option value="normal">普通肌</option>
        </select>
      </div>

      <div>
        <label class="sp-checkbox-row">
          <input type="checkbox" name="newsletter" value="1" class="sp-checkbox-input" checked>
          <span>新商品・キャンペーン情報のメールを受け取る（いつでも解除可能）</span>
        </label>
      </div>

      <div>
        <label class="sp-checkbox-row">
          <input type="checkbox" name="privacy" required class="sp-checkbox-input">
          <span><a href="../privacy-policy/index.html" target="_blank" rel="noopener" class="sp-link">プライバシーポリシー</a>に同意する</span>
        </label>
      </div>

      <div>
        <button type="submit" class="btn-gold btn-gold-full">
          サンプルを請求する（無料）
        </button>
        <p class="sp-form-note">
          お申込み受付後、2〜3営業日以内に発送します
        </p>
      </div>
    </form>

    <p class="sp-footnote">
      ※ サンプルはお一人様1回限りです。同一住所への複数申込はお断りする場合があります。<br>
      ※ 在庫状況によりご希望に添えない場合がございます。あらかじめご了承ください。
    </p>
  </div>
</main>

<footer class="sp-footer">
  <p>© <span id="yr">2026</span> LUMIÉRE Japan. All rights reserved.</p>
</footer>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  /* GA4: サンプル請求フォーム送信イベント（WordPress移植後、実際の送信完了イベントに置き換えてください） */
  var sampleForm = document.getElementById('sample-request-form');
  if (sampleForm && typeof gtag === 'function') {
    sampleForm.addEventListener('submit', function () {
      gtag('event', 'generate_lead', { form: 'sample_request' });
    });
  }
</script>
</body>
</html>
