<!DOCTYPE html>
<!-- WordPress移植時: このファイルを削除し、WooCommerceのチェックアウトページまたはContact Form 7の申込みフォームに置き換えてください -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お申込み | UV FORTE シールドセラム</title>
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .order-hero {
      background: var(--navy);
      color: #fff;
      text-align: center;
      padding: 3rem 1.5rem 2.5rem;
    }
    .order-hero h1 {
      font-family: var(--ff-nserif);
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: .5rem;
    }
    .order-hero p { font-size: .875rem; color: rgba(255,255,255,.70); }
    .plan-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 480px) { .plan-cards { grid-template-columns: 1fr; } }
    .plan-card {
      border: 2px solid rgba(27,108,168,.25);
      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .plan-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .plan-card:has(input:checked) {
      border-color: var(--blue);
      background: oklch(93% 0.030 248);
    }
    .plan-card-badge {
      display: inline-block;
      background: var(--cta);
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      padding: .15rem .5rem;
      border-radius: 4px;
      margin-bottom: .4rem;
    }
    .plan-card-name {
      font-size: .95rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: .2rem;
    }
    .plan-card-price-wrap {
      display: flex;
      align-items: baseline;
      gap: .1rem;
      line-height: 1;
      margin-bottom: .15rem;
    }
    .plan-card-yen {
      font-family: var(--ff-nsans);
      font-size: .95rem;
      font-weight: 400;
      color: var(--navy);
    }
    .plan-card-price {
      font-family: var(--ff-price);
      font-size: 3rem;
      font-weight: 700;
      font-style: italic;
      color: var(--navy);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .plan-card-price-note {
      font-family: var(--ff-nsans);
      font-size: .75rem;
      color: var(--gray);
      font-weight: 400;
      margin-left: .2rem;
    }
    .plan-card-note { font-size: .75rem; color: var(--gray); margin-top: .3rem; line-height: 1.5; }
    .order-guarantee {
      display: flex;
      align-items: center;
      gap: .6rem;
      background: oklch(93% 0.030 248);
      border: 1px solid rgba(27,108,168,.18);
      border-radius: 8px;
      padding: .75rem 1rem;
      margin-bottom: 1.5rem;
      font-size: .825rem;
      color: var(--gray-dk);
    }
    .order-guarantee-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .order-section-title {
      font-family: var(--ff-nserif);
      font-size: .95rem;
      font-weight: 700;
      color: var(--navy);
      border-left: 3px solid var(--gold);
      padding-left: .6rem;
      margin: 1.75rem 0 1rem;
    }
    .addr-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: .75rem;
    }
    @media (max-width: 480px) { .addr-grid { grid-template-columns: 1fr; } }
    .payment-options {
      display: grid;
      gap: .5rem;
    }
    .payment-option {
      display: flex;
      align-items: center;
      gap: .6rem;
      border: 1px solid rgba(27,108,168,.2);
      border-radius: 7px;
      padding: .7rem .9rem;
      cursor: pointer;
      font-size: .9rem;
      color: var(--navy);
      transition: border-color .2s, background .2s;
    }
    .payment-option:has(input:checked) {
      border-color: var(--blue);
      background: oklch(93% 0.030 248);
    }
    .payment-option input[type="radio"] { accent-color: var(--blue); }
    .order-submit-area {
      margin-top: 2rem;
      text-align: center;
    }
    .order-submit-area .btn-gold {
      width: 100%;
      max-width: 400px;
      justify-content: center;
      font-size: 1.05rem;
      padding: 1rem 2rem;
    }
    .order-terms {
      font-size: .8rem;
      color: var(--gray);
      margin-top: .75rem;
      line-height: 1.7;
    }
    .order-terms a { color: var(--blue); text-decoration: underline; }
  </style>
</head>
<body class="font-sans bg-white text-navy">

<header class="sp-header">
  <a href="../" class="sp-header-logo">LUMIÉRE</a>
  <span style="font-size:.8rem;color:rgba(255,255,255,.6);">お申込みフォーム</span>
</header>

<div class="order-hero">
  <h1>UV FORTE シールドセラム お申込み</h1>
  <p>30日間全額返金保証付き・翌日発送（15時注文まで）</p>
</div>

<main class="sp-body" style="padding-top:2rem;">
  <div class="sp-inner" style="max-width:640px;">

    <!-- WordPress移植時: このformをWooCommerceチェックアウトまたはContact Form 7に置き換え -->
    <form id="order-form" action="#" method="post" novalidate>
      <input type="hidden" name="form_type" value="order">

      <!-- プラン選択 -->
      <div class="order-section-title">プランを選ぶ</div>
      <div class="plan-cards">
        <label class="plan-card">
          <input type="radio" name="plan" value="teiki" id="plan-teiki" checked>
          <div class="plan-card-badge">おすすめ</div>
          <div class="plan-card-name">定期便（初回50%OFF）</div>
          <div class="plan-card-price-wrap"><span class="plan-card-yen">¥</span><span class="plan-card-price">1,740</span><span class="plan-card-price-note">（税込）</span></div>
          <div class="plan-card-note">2回目以降 ¥2,784<br>送料無料・いつでも解約可</div>
        </label>
        <label class="plan-card">
          <input type="radio" name="plan" value="tanpin" id="plan-tanpin">
          <div style="height:1.35rem;"></div>
          <div class="plan-card-name">単品購入</div>
          <div class="plan-card-price-wrap"><span class="plan-card-yen">¥</span><span class="plan-card-price">3,480</span><span class="plan-card-price-note">（税込）</span></div>
          <div class="plan-card-note">送料 ¥550 別途<br>縛りなし</div>
        </label>
      </div>

      <div class="order-guarantee">
        <span class="order-guarantee-icon">🛡</span>
        <span>30日間全額返金保証付き。開封・使用後でも理由を問わず全額お返しします。</span>
      </div>

      <!-- お客様情報 -->
      <div class="order-section-title">お客様情報</div>
      <div class="sp-form-grid">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
          <div>
            <label class="sp-form-label" for="o-sei">姓 <span class="req">必須</span></label>
            <input class="sp-form-input" type="text" id="o-sei" name="sei"
              placeholder="山田" autocomplete="family-name" required>
          </div>
          <div>
            <label class="sp-form-label" for="o-mei">名 <span class="req">必須</span></label>
            <input class="sp-form-input" type="text" id="o-mei" name="mei"
              placeholder="花子" autocomplete="given-name" required>
          </div>
        </div>
        <div>
          <label class="sp-form-label" for="o-email">メールアドレス <span class="req">必須</span></label>
          <input class="sp-form-input" type="email" id="o-email" name="email"
            placeholder="example@email.com" autocomplete="email" required>
        </div>
        <div>
          <label class="sp-form-label" for="o-tel">電話番号 <span class="req">必須</span></label>
          <input class="sp-form-input" type="tel" id="o-tel" name="tel"
            placeholder="090-0000-0000" autocomplete="tel" required>
        </div>
      </div>

      <!-- お届け先 -->
      <div class="order-section-title">お届け先</div>
      <div class="sp-form-grid">
        <div>
          <label class="sp-form-label" for="o-zip">郵便番号 <span class="req">必須</span></label>
          <input class="sp-form-input" type="text" id="o-zip" name="zip"
            placeholder="000-0000" autocomplete="postal-code" maxlength="8"
            required style="max-width:180px;">
        </div>
        <div>
          <label class="sp-form-label" for="o-pref">都道府県 <span class="req">必須</span></label>
          <select class="sp-form-select" id="o-pref" name="pref" autocomplete="address-level1" required style="max-width:180px;">
            <option value="" disabled selected>選択</option>
            <option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option>
            <option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option>
            <option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option>
            <option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option>
            <option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option>
            <option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option>
            <option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option>
          </select>
        </div>
        <div>
          <label class="sp-form-label" for="o-addr">市区町村・番地 <span class="req">必須</span></label>
          <input class="sp-form-input" type="text" id="o-addr" name="address"
            placeholder="渋谷区〇〇町1-2-3" autocomplete="address-line1" required>
        </div>
        <div>
          <label class="sp-form-label" for="o-bldg">建物名・部屋番号 <span style="font-size:.75rem;color:var(--gray);font-weight:400;">任意</span></label>
          <input class="sp-form-input" type="text" id="o-bldg" name="building"
            placeholder="LUMIÉREマンション 101号室" autocomplete="address-line2">
        </div>
      </div>

      <!-- お支払い方法 -->
      <div class="order-section-title">お支払い方法</div>
      <div class="payment-options">
        <label class="payment-option">
          <input type="radio" name="payment" value="card" checked>
          <span>💳 クレジットカード（VISA / Mastercard / JCB / AMEX）</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="cod">
          <span>📦 代金引換（手数料 ¥330）</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="convenience">
          <span>🏪 コンビニ払い</span>
        </label>
        <label class="payment-option">
          <input type="radio" name="payment" value="amazon">
          <span>Amazon Pay</span>
        </label>
      </div>

      <!-- クーポン -->
      <div class="order-section-title">クーポンコード</div>
      <div style="display:flex;gap:.6rem;max-width:360px;">
        <input class="sp-form-input" type="text" name="coupon"
          placeholder="お持ちの方はご入力ください">
        <button type="button" style="flex-shrink:0;padding:.65rem 1rem;border:1px solid rgba(27,108,168,.3);border-radius:6px;background:#fff;color:var(--blue);font-size:.875rem;cursor:pointer;white-space:nowrap;">適用</button>
      </div>

      <!-- 同意・送信 -->
      <div class="order-submit-area">
        <div style="max-width:400px;margin:0 auto 1rem;text-align:left;">
          <label style="display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;font-size:.875rem;color:var(--gray-dk);">
            <input type="checkbox" name="agree" required style="margin-top:.2rem;flex-shrink:0;accent-color:var(--blue);">
            <span>
              <a href="../tokushoho/index.html" target="_blank" style="color:var(--blue);text-decoration:underline;">特定商取引法に基づく表記</a>・
              <a href="../privacy-policy/index.html" target="_blank" style="color:var(--blue);text-decoration:underline;">プライバシーポリシー</a>・
              <a href="../returns/index.html" target="_blank" style="color:var(--blue);text-decoration:underline;">返品ポリシー</a>に同意する
            </span>
          </label>
        </div>
        <button type="submit" class="btn-gold">
          注文を確定する <span class="btn-gold-icon">→</span>
        </button>
        <p class="order-terms">
          ご注文確定後、確認メールをお送りします。<br>
          翌日発送（15時までのご注文）・30日間全額返金保証付き
        </p>
      </div>

    </form>
  </div>
</main>

<footer class="sp-footer">
  <p>© <span id="yr">2026</span> LUMIÉRE Japan. All rights reserved.</p>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  /* URLパラメータでプラン初期選択 */
  const params = new URLSearchParams(location.search);
  const plan = params.get('plan');
  if (plan === 'tanpin') {
    document.getElementById('plan-tanpin').checked = true;
  } else {
    document.getElementById('plan-teiki').checked = true;
  }
</script>
</body>
</html>
