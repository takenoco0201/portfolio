<!DOCTYPE html>
<!-- WordPress移植時: このファイルを削除し、Contact Form 7等のプラグインを使ったWordPressの固定ページ（スラッグ: contact）に置き換えてください -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | UV FORTE シールドセラム</title>
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="font-sans bg-white text-navy">

<header class="sp-header">
  <a href="../" class="sp-header-logo">LUMIÉRE</a>
  <a href="../order/index.html?plan=teiki" class="btn-gold-sm">今すぐ購入</a>
</header>

<main class="sp-body">
  <div class="sp-inner">
    <h1>お問い合わせ</h1>

    <div class="sp-notice">
      返品・返金については<a href="../returns/index.html" style="color:var(--blue);text-decoration:underline;">返品・返金ポリシー</a>もあわせてご確認ください。返品をご希望の場合は、問い合わせ種別で「返品・返金について」を選択してください。
    </div>

    <!-- WordPress移植時: このformタグをContact Form 7のショートコードに置き換えてください -->
    <!-- 例: [contact-form-7 id="XXX" title="お問い合わせ"] -->
    <form class="sp-form-grid" action="#" method="post" novalidate>
      <input type="hidden" name="form_type" value="contact">

      <div>
        <label class="sp-form-label" for="contact-name">
          お名前 <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="text" id="contact-name" name="name"
          placeholder="山田 花子" autocomplete="name" required>
      </div>

      <div>
        <label class="sp-form-label" for="contact-email">
          メールアドレス <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="email" id="contact-email" name="email"
          placeholder="example@email.com" autocomplete="email" required>
      </div>

      <div>
        <label class="sp-form-label" for="contact-tel">
          電話番号 <span style="font-size:.75rem;color:var(--gray);font-weight:400;">任意</span>
        </label>
        <input class="sp-form-input" type="tel" id="contact-tel" name="tel"
          placeholder="090-0000-0000" autocomplete="tel">
      </div>

      <div>
        <label class="sp-form-label" for="contact-type">
          問い合わせ種別 <span class="req">必須</span>
        </label>
        <select class="sp-form-select" id="contact-type" name="type" required>
          <option value="" disabled selected>選択してください</option>
          <option value="product">商品について</option>
          <option value="order">注文・配送について</option>
          <option value="returns">返品・返金について</option>
          <option value="teiki">定期便の変更・解約について</option>
          <option value="sample">サンプルについて</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div>
        <label class="sp-form-label" for="contact-order">
          注文番号 <span style="font-size:.75rem;color:var(--gray);font-weight:400;">任意（お持ちの場合）</span>
        </label>
        <input class="sp-form-input" type="text" id="contact-order" name="order_no"
          placeholder="例: LJ-20260601-00001">
      </div>

      <div>
        <label class="sp-form-label" for="contact-message">
          お問い合わせ内容 <span class="req">必須</span>
        </label>
        <textarea class="sp-form-textarea" id="contact-message" name="message"
          placeholder="ご質問・ご要望をできるだけ詳しくご記入ください。" required></textarea>
      </div>

      <div>
        <label style="display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;font-size:.875rem;color:var(--gray-dk);">
          <input type="checkbox" name="privacy" required style="margin-top:.2rem;flex-shrink:0;">
          <span><a href="../privacy-policy/index.html" target="_blank" style="color:var(--blue);text-decoration:underline;">プライバシーポリシー</a>に同意する</span>
        </label>
      </div>

      <div>
        <button type="submit" class="btn-gold" style="width:100%;justify-content:center;">
          送信する
        </button>
        <p style="font-size:.8rem;color:var(--gray);margin-top:.75rem;text-align:center;">
          通常1〜2営業日以内にご返信いたします（土日祝を除く）
        </p>
      </div>
    </form>

    <h2>電話でのお問い合わせ</h2>
    <p>（要記入: 0X0-XXXX-XXXX）<br>
    受付時間：平日 10:00〜17:00（土日祝・年末年始を除く）</p>
  </div>
</main>

<footer class="sp-footer">
  <p>© <span id="yr">2026</span> LUMIÉRE Japan. All rights reserved.</p>
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
