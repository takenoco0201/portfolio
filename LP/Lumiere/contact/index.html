<!DOCTYPE html>
<!-- WordPress移植時: このファイルを削除し、Contact Form 7等のプラグインを使ったWordPressの固定ページ（スラッグ: contact）に置き換えてください -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UV FORTE シールドセラムに関するお問い合わせフォーム。商品・注文・返品・定期便について、担当よりご返信いたします。">
  <title>お問い合わせ | UV FORTE シールドセラム</title>
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="canonical" href="https://lumiere-cosme.jp/contact/">
  <meta property="og:title" content="お問い合わせ | UV FORTE シールドセラム">
  <meta property="og:description" content="商品・注文・返品・定期便に関するお問い合わせフォームです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lumiere-cosme.jp/contact/">
  <meta property="og:image" content="https://lumiere-cosme.jp/images/ogp.png">
  <meta property="og:site_name" content="LUMIÉRE">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <!-- GA4測定IDはダミー値です。実案件公開時に実測定IDへ差し替えてください -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <!-- Webフォント: 自己ホスト化（2026-07-17） -->
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="font-sans bg-white text-navy">

<header class="sp-header">
  <a href="../index.html" class="sp-header-logo">LUMIÉRE</a>
  <a href="../order/index.html?plan=teiki" class="btn-gold-sm">今すぐ購入</a>
</header>

<main class="sp-body">
  <div class="sp-inner">
    <h1>お問い合わせ</h1>

    <div class="sp-notice">
      返品・返金については<a href="../returns/index.html" class="sp-link">返品・返金ポリシー</a>もあわせてご確認ください。返品をご希望の場合は、問い合わせ種別で「返品・返金について」を選択してください。
    </div>

    <!-- WordPress移植時: このformタグをContact Form 7のショートコードに置き換えてください -->
    <!-- 例: [contact-form-7 id="XXX" title="お問い合わせ"] -->
    <form id="contact-form" class="sp-form-grid" action="#" method="post">
      <input type="hidden" name="form_type" value="contact">
      <div class="hp-field" aria-hidden="true">
        <label for="c-hp">この項目は入力しないでください</label>
        <input type="text" id="c-hp" name="hp_confirm" tabindex="-1" autocomplete="off">
      </div>

      <div>
        <label class="sp-form-label" for="contact-name">
          お名前 <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="text" id="contact-name" name="name"
          placeholder="山田 花子" autocomplete="name" required>
      </div>

      <div>
        <label class="sp-form-label" for="contact-email">
          メールアドレス <span class="req">必須</span>
        </label>
        <input class="sp-form-input" type="email" id="contact-email" name="email"
          placeholder="example@email.com" autocomplete="email" required>
      </div>

      <div>
        <label class="sp-form-label" for="contact-tel">
          電話番号 <span class="sp-optional-label">任意</span>
        </label>
        <input class="sp-form-input" type="tel" id="contact-tel" name="tel"
          placeholder="090-0000-0000" autocomplete="tel">
      </div>

      <div>
        <label class="sp-form-label" for="contact-type">
          問い合わせ種別 <span class="req">必須</span>
        </label>
        <select class="sp-form-select" id="contact-type" name="type" required>
          <option value="" disabled selected>選択してください</option>
          <option value="product">商品について</option>
          <option value="order">注文・配送について</option>
          <option value="returns">返品・返金について</option>
          <option value="teiki">定期便の変更・解約について</option>
          <option value="sample">サンプルについて</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div>
        <label class="sp-form-label" for="contact-order">
          注文番号 <span class="sp-optional-label">任意（お持ちの場合）</span>
        </label>
        <input class="sp-form-input" type="text" id="contact-order" name="order_no"
          placeholder="例: LJ-20260601-00001">
      </div>

      <div>
        <label class="sp-form-label" for="contact-message">
          お問い合わせ内容 <span class="req">必須</span>
        </label>
        <textarea class="sp-form-textarea" id="contact-message" name="message"
          placeholder="ご質問・ご要望をできるだけ詳しくご記入ください。" required></textarea>
      </div>

      <div>
        <label class="sp-checkbox-row">
          <input type="checkbox" name="privacy" required class="sp-checkbox-input">
          <span><a href="../privacy-policy/index.html" target="_blank" rel="noopener" class="sp-link">プライバシーポリシー</a>に同意する</span>
        </label>
      </div>

      <div>
        <button type="submit" class="btn-gold btn-gold-full">
          送信する
        </button>
        <p class="sp-form-note">
          通常1〜2営業日以内にご返信いたします（土日祝を除く）
        </p>
      </div>
    </form>

    <h2>電話でのお問い合わせ</h2>
    <p><a href="tel:0345678901">03&#8209;4567&#8209;8901</a><br>
    受付時間：平日 10:00〜17:00（土日祝・年末年始を除く）</p>
  </div>
</main>

<footer class="sp-footer">
  <p>© <span id="yr">2026</span> LUMIÉRE Japan. All rights reserved.</p>
</footer>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  /* GA4: お問い合わせフォーム送信イベント（WordPress移植後、実際の送信完了イベントに置き換えてください） */
  var contactForm = document.getElementById('contact-form');
  if (contactForm && typeof gtag === 'function') {
    contactForm.addEventListener('submit', function () {
      gtag('event', 'generate_lead', { form: 'contact' });
    });
  }
</script>
</body>
</html>
